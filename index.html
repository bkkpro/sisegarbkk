<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SISEGAR - Sistem Informasi Sehat &amp; Bugar</title>
  <link rel="icon" href="https://raw.githubusercontent.com/pipin4/aset_sisegar/main/sisegar_copilot.png">
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#F4F7F6; font-family:'Segoe UI',Roboto,Arial,sans-serif; }
    #loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:linear-gradient(135deg,#006064,#0AB7BA); color:#fff; z-index:2; transition:opacity .5s ease; }
    #loader img { width:90px; height:90px; border-radius:50%; background:linear-gradient(135deg,#16AF97,#006064); padding:14px; border:3px solid #fff; box-shadow:0 10px 25px rgba(0,0,0,.3); object-fit:contain; box-sizing:border-box; }
    #loader b { font-size:20px; letter-spacing:.04em; }
    #loader span { font-size:12.5px; opacity:.9; }
    #loader.hide { opacity:0; pointer-events:none; }
    iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#F4F7F6; }
    #fallback { position:fixed; bottom:12px; left:0; right:0; text-align:center; font-size:12px; color:#fff; z-index:3; }
    #fallback a { color:#fff; font-weight:700; }
  </style>
</head>
<body>
  <div id="loader">
    <img src="https://raw.githubusercontent.com/pipin4/aset_sisegar/main/sisegar_copilot.png" alt="Logo SISEGAR">
    <b>SISEGAR</b>
    <span>Memuat aplikasi...</span>
  </div>
  <div id="fallback">Layar tidak muncul? <a id="directLink" href="#" target="_top">Buka langsung</a></div>

  <!-- GANTI URL di bawah dengan URL Web App Anda (yang berakhiran /exec) -->
  <iframe id="app" title="SISEGAR" allow="fullscreen"
          src="https://bkk.s.gy/sisegarbkk"></iframe>

  <script>
    var frame = document.getElementById('app');
    document.getElementById('directLink').href = frame.src;
    frame.addEventListener('load', function () {
      document.getElementById('loader').classList.add('hide');
      document.getElementById('fallback').style.display = 'none';
    });
    // Jika dalam 12 detik belum selesai dimuat, loader tetap disembunyikan agar tombol "Buka langsung" terlihat jelas
    setTimeout(function () { document.getElementById('loader').classList.add('hide'); }, 12000);
  </script>
</body>
</html>
